{% extends "base.html" %}
{% block content %}
<section class="panel">
  <div class="panel-head">
    <h1>Run</h1>
    <div id="health" class="status-pill">OpenAI</div>
  </div>
  <form id="run-form" class="run-form">
    <label>
      From
      <input name="date_from" type="date" required>
    </label>
    <label>
      To
      <input name="date_to" type="date" required>
    </label>
    <label class="wide">
      Run request
      <input name="request_text" type="text" placeholder="Optional">
    </label>
    <button type="submit">Start Run</button>
  </form>
</section>

<section class="panel">
  <div class="panel-head">
    <h2>Diagnostics & Secrets</h2>
    <span id="diagnostic-email-status" class="muted"></span>
  </div>
  <form id="diagnostic-email-form" class="settings-form">
    <label>
      Recipient
      <input name="recipient" type="email" placeholder="support@example.com">
    </label>
    <label>
      SMTP preset
      <select name="smtp_preset">
        <option value="">Custom</option>
        <option value="gmail">Google Workspace/Gmail</option>
        <option value="microsoft365">Microsoft 365/Outlook</option>
        <option value="yahoo">Yahoo Mail</option>
        <option value="icloud">iCloud Mail</option>
        <option value="zoho">Zoho Mail</option>
      </select>
    </label>
    <label>
      SMTP host
      <input name="smtp_host" type="text" placeholder="smtp.example.com">
    </label>
    <label>
      Port
      <input name="smtp_port" type="number" min="1" max="65535" value="587">
    </label>
    <label>
      Username
      <input name="smtp_username" type="text" autocomplete="username">
    </label>
    <label>
      Password
      <input name="smtp_password" type="password" autocomplete="new-password" placeholder="Leave blank to keep saved">
    </label>
    <label>
      Sender
      <input name="sender" type="email" placeholder="Optional">
    </label>
    <label class="inline-toggle">
      <input name="enabled" type="checkbox">
      Auto email failures
    </label>
    <label class="inline-toggle">
      <input name="use_starttls" type="checkbox" checked>
      STARTTLS
    </label>
    <label class="inline-toggle">
      <input name="use_ssl" type="checkbox">
      SSL
    </label>
    <div class="panel-actions wide-actions">
      <button type="submit">Save Email</button>
      <button id="test-diagnostic-email" class="secondary" type="button">Test Email</button>
      <button id="send-diagnostic-email" class="secondary" type="button">Send Diagnostics</button>
      <button id="clear-openai-key" class="danger" type="button">Clear OpenAI Key</button>
      <button id="clear-email-secret" class="danger" type="button">Clear Email Secret</button>
      <button id="clear-all-secrets" class="danger" type="button">Clear All Secrets</button>
    </div>
  </form>
</section>

<section class="grid two">
  <div class="panel">
    <div class="panel-head">
      <h2>Runs</h2>
      <div class="panel-actions">
        <button id="refresh-runs" type="button">Refresh</button>
        <button id="download-state-bundle" class="secondary" type="button">State Bundle</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Dates</th><th>Status</th><th>Agenda</th><th>Apps</th><th></th></tr>
        </thead>
        <tbody id="runs-body"></tbody>
      </table>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head">
      <h2>Log</h2>
      <span id="log-run" class="muted"></span>
    </div>
    <div id="run-events" class="log"></div>
  </div>
</section>
{% endblock %}
